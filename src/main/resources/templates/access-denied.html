<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Akses Ditolak - PT. LWI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Font modern -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                linear-gradient(rgba(0, 0, 0, 0.50), rgba(0, 0, 0, 0.60)),
                url("/images/D1.png") no-repeat center center/cover;
            overflow: hidden;
        }

        .error-wrapper {
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .error-card {
            width: 100%;
            max-width: 430px;
            padding: 38px 30px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.32);
            text-align: center;
            color: #fff;
            animation: fadeUp 0.6s ease;
        }

        .error-circle {
            width: 88px;
            height: 88px;
            margin: 0 auto 22px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 18px 40px rgba(239, 68, 68, 0.35);
            animation: popIn 0.55s ease;
        }

        .error-circle svg {
            width: 42px;
            height: 42px;
            stroke: white;
            stroke-width: 3;
            fill: none;
        }

        .error-badge {
            display: inline-block;
            margin-bottom: 14px;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.12);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.4px;
        }

        .error-card h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .error-card p {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.82);
            line-height: 1.8;
            margin-bottom: 24px;
        }

        .redirect-info {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.72);
            margin-bottom: 18px;
        }

        .progress-track {
            width: 100%;
            height: 8px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.14);
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, #ef4444, #f87171);
            animation: loadingBar 2.4s linear forwards;
        }

        .manual-btn {
            display: inline-block;
            margin-top: 22px;
            padding: 12px 22px;
            border-radius: 999px;
            background: #ffffff;
            color: #111827;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.25s ease;
        }

        .manual-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(255, 255, 255, 0.18);
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(18px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.7);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes loadingBar {
            from {
                width: 0%;
            }

            to {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .error-card {
                padding: 30px 22px;
                border-radius: 24px;
            }

            .error-card h1 {
                font-size: 24px;
            }

            .error-card p {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="error-wrapper">
        <div class="error-card">
            <div class="error-circle">
                <svg viewBox="0 0 24 24">
                    <path d="M12 8v5"></path>
                    <circle cx="12" cy="16.5" r="0.7" fill="white" stroke="white"></circle>
                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z">
                    </path>
                </svg>
            </div>

            <div class="error-badge" th:text="${targetRole}">FILW-NB</div>

            <h1 th:text="${title}">Akses Ditolak</h1>
            <p th:text="${message}">
                Anda mencoba membuka area tertentu. Silakan login menggunakan akun yang sesuai.
            </p>

            <div class="redirect-info">Mengarahkan ke halaman login...</div>

            <div class="progress-track">
                <div class="progress-bar"></div>
            </div>

            <a id="manualRedirect" href="#" class="manual-btn">Login Sekarang</a>
        </div>
    </div>

    <script th:inline="javascript">
        document.addEventListener("DOMContentLoaded", function () {
            const redirectUrl = /*[[${redirectUrl}]]*/ "/login";
            const manualBtn = document.getElementById("manualRedirect");

            manualBtn.href = redirectUrl;

            setTimeout(() => {
                window.location.href = redirectUrl;
            }, 2400);
        });
    </script>

</body>

</html>
