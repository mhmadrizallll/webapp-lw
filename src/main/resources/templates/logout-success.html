<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Logout Berhasil - PT. LWI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Font modern -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Style utama portal -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- Style khusus login/logout -->
    <link rel="stylesheet" th:href="@{/css/login.css}">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.55)), url("/images/D1.png") no-repeat center/cover;
            overflow: hidden;
        }

        /* LOADING OVERLAY */
        #loadingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.3s;
            opacity: 1;
        }

        #loadingOverlay.hide {
            opacity: 0;
            pointer-events: none;
        }

        .loader-ring {
            width: 60px;
            height: 60px;
            border: 6px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-text {
            margin-top: 12px;
            color: #fff;
            font-size: 16px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* SUCCESS CARD */
        .success-wrapper {
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 10;
            display: none;
        }

        .success-card {
            width: 100%;
            max-width: 400px;
            padding: 36px 28px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.30);
            text-align: center;
            color: #fff;
            animation: fadeUp 0.6s ease;
        }

        .check-circle {
            width: 88px;
            height: 88px;
            margin: 0 auto 22px;
            border-radius: 50%;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 18px 40px rgba(34, 197, 94, 0.35);
            animation: popIn 0.55s ease;
        }

        .check-circle svg {
            width: 42px;
            height: 42px;
            stroke: white;
            stroke-width: 3;
            fill: none;
        }

        .success-card h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .success-card p {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.82);
            line-height: 1.7;
            margin-bottom: 24px;
        }

        .redirect-info {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.72);
            margin-bottom: 18px;
        }

        .progress-track {
            width: 100%;
            height: 8px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.14);
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, #22c55e, #4ade80);
            animation: loadingBar 2.2s linear forwards;
        }

        .manual-btn {
            display: inline-block;
            margin-top: 22px;
            padding: 12px 22px;
            border-radius: 999px;
            background: #ffffff;
            color: #111827;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.25s ease;
        }

        .manual-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(255, 255, 255, 0.18);
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(18px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.7);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes loadingBar {
            from {
                width: 0%;
            }

            to {
                width: 100%;
            }
        }

        @media (max-width:480px) {
            .success-card {
                padding: 30px 22px;
                border-radius: 24px;
            }

            .success-card h1 {
                font-size: 24px;
            }

            .success-card p {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <!-- LOADING OVERLAY -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-card">
            <div class="loader-ring"></div>
            <h3>Signing out...</h3>
            <p class="loading-text">Mohon tunggu sebentar</p>
        </div>
    </div>

    <!-- Logout success -->
    <div class="success-wrapper">
        <div class="success-card">
            <div class="check-circle">
                <svg viewBox="0 0 24 24">
                    <path d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            <h1>Logout Berhasil</h1>
            <p>Anda telah berhasil logout dari portal PT. LWI. Sampai jumpa!</p>
            <div class="redirect-info">Mengarahkan ke halaman login...</div>
            <div class="progress-track">
                <div class="progress-bar"></div>
            </div>
            <a id="manualRedirect" href="#" class="manual-btn">Masuk Sekarang</a>
        </div>
    </div>

    <!-- SCRIPT LOGOUT LOADING -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const loadingOverlay = document.getElementById("loadingOverlay");
            const successWrapper = document.querySelector(".success-wrapper");
            const manualBtn = document.getElementById("manualRedirect");
            const redirectUrl = /*[[${redirectUrl}]]*/ "/login";

            manualBtn.href = redirectUrl;

            // Tampilkan overlay sebentar sebelum card
            setTimeout(() => {
                loadingOverlay.classList.add("show");

                // sembunyikan overlay & tampilkan success card
                setTimeout(() => {
                    loadingOverlay.classList.add("hide");
                    successWrapper.style.display = "flex";

                    // redirect otomatis sesuai progress bar
                    setTimeout(() => {
                        window.location.href = redirectUrl;
                    }, 2200);
                }, 1000); // 1 detik overlay sebelum card muncul
            }, 100);
        });
    </script>
</body>

</html>
